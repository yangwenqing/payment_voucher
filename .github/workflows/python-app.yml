# 支付凭单生成台 CI：依赖安装 → 语法检查（Python + 前端 JS）→ 冒烟测试
# 数据库相关的端到端验证在本地开发环境进行，CI 中数据库未配置（默认空），
# 测试只覆盖不依赖数据库的核心逻辑与登录/预览接口行为。
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.12" ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node（前端语法检查用）
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest

    - name: Lint with flake8
      run: |
        # 语法错误或未定义名称直接失败
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # 其余风格问题仅警告
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Compile Python sources
      run: python -m compileall -q app.py db.py voucher.py security.py connectdb.py tests

    - name: Check frontend syntax
      run: node --check static/app.js

    - name: Run smoke tests
      # python -m pytest 会把当前目录加入 sys.path，保证 tests 内可导入项目模块
      run: python -m pytest -v
